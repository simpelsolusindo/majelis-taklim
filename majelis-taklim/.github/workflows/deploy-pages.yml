name: Deploy Pages (Frontend)

on:
  push:
    branches: [main]
    paths:
      - 'majelis-taklim/temp-update/majelis-taklim-frontend/**'  # jalan kalau ada perubahan frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy ke GitHub Pages
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: majelis-taklim/temp-update/majelis-taklim-frontend/package-lock.json

      - name: Install dependencies
        working-directory: majelis-taklim/temp-update/majelis-taklim-frontend
        run: npm ci

      - name: Build
        working-directory: majelis-taklim/temp-update/majelis-taklim-frontend
        run: npm run build
        env:
          VITE_API_URL: https://majelis-taklim-api.mohammadbasuki31.workers.dev/api

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: majelis-taklim/temp-update/majelis-taklim-frontend/dist

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
